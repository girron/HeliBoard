name: Test build
# builds only for a single abi and does not produce an APK

on:
# disabled on push: when I push to non-main, I do a PR anyway
#  push:
    # don't run on main. I noticed I often don't push commits to avoid unnecessary workflow runs
#    branches-ignore: [ main ]
#    paths:
#      - 'app/**'
  pull_request:
    paths:
      - 'app/src/main/java**'
      - '.github/workflows/build-test-auto.yml'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew testDebugUnitTest --tests "*InputLogicTest.*autocorrect*"

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}

  signed-debug-apk:
    # PRs targeting octopus-mvp may restore its stable debug key; feature branches may not.
    # This temporary validation job NEVER generates or saves a replacement signing key.
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'octopus-mvp' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Restore original Octopus signing key
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: heliboard-octopus-debug-keystore-v2

      - name: Require original Octopus signing certificate
        run: |
          test -f "$HOME/.android/debug.keystore" || { echo "::error::Original debug keystore unavailable"; exit 1; }
          EXPECTED="36:19:34:24:BF:46:D3:32:41:F3:35:2C:C5:2F:46:4C:DB:8F:13:15:07:0D:32:D8:96:FE:9C:7B:E3:F3:07:60"
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1)"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::Wrong Octopus debug signing certificate"; exit 1; }

      - name: Build signed debug APK
        env:
          OCTOPUS_DEBUG_KEYSTORE: /home/runner/.android/debug.keystore
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK signing certificate
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*-debug*.apk' -print -quit)"
          test -n "$APK"
          EXPECTED="36:19:34:24:BF:46:D3:32:41:F3:35:2C:C5:2F:46:4C:DB:8F:13:15:07:0D:32:D8:96:FE:9C:7B:E3:F3:07:60"
          ACTUAL="$(keytool -printcert -jarfile "$APK" | sed -n 's/.*SHA256: //p' | head -1)"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::APK certificate doesn't match installed Octopus"; exit 1; }

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Octopus-Keyboard-debug
          path: app/build/outputs/apk/debug/*-debug*.apk
